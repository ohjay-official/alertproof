name: verify

# The one-command check, on GitHub's machines (CI is the laptop: this project
# is built from a phone). Installs packages, then runs the types, the unit,
# adversarial and fuzz tests, the official Cashu curve vectors, and the
# Go/No-Go run on the Cashu test mint (fake sats). Logs, installed versions
# and the lockfile go to the verify-results branch, so a session can read
# them without anyone copying logs by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        id: install
        run: |
          mkdir -p ci-out
          set -o pipefail
          # Falls back to npm install when a new package isn't in the lockfile
          # yet; the updated lockfile is published below for the repo.
          { npm ci --no-audit --no-fund || npm install --no-audit --no-fund; } 2>&1 | tee ci-out/install.log
          { node -v; npm ls --depth=0; } 2>&1 | tee ci-out/versions.txt

      - name: Types
        id: types
        continue-on-error: true
        run: set -o pipefail && npx tsc -p tsconfig.json 2>&1 | tee ci-out/types.log

      - name: Tests and curve vectors
        id: tests
        continue-on-error: true
        run: set -o pipefail && npm test 2>&1 | tee ci-out/test.log

      - name: Mutation testing (each rule broken on purpose must fail a test)
        id: mutate
        continue-on-error: true
        run: set -o pipefail && node scripts/mutate.mjs 2>&1 | tee ci-out/mutate.log

      # The library's own type declarations for the token functions, so a
      # session without package installs can read the exact API.
      - name: Note the cashu-ts token API
        continue-on-error: true
        run: |
          D=node_modules/@cashu/cashu-ts
          {
            echo "== package exports"; node -e 'console.log(Object.keys(require("./node_modules/@cashu/cashu-ts/package.json").exports||{}).join("\n"))'
            echo "== d.ts files"; find $D -name '*.d.ts' | head -40
            echo "== getEncodedToken / getDecodedToken / Token / Proof declarations"
            grep -rhn -A12 -E 'export declare function (getEncodedToken|getDecodedToken)\b|^export (type|interface) (Token|Proof|ProofDLEQ|SerializedDLEQ|Amount)\b|declare (type|class) Amount\b' $D --include='*.d.ts' | head -200
            echo "== migration notes on tokens and amounts"
            grep -n -i -E 'getEncodedToken|getDecodedToken|amount|toLowerCase' $D/migration-4.0.0.md 2>/dev/null | head -60
          } > ci-out/cashu-ts-api.txt 2>&1

      - name: Probe the test mints
        continue-on-error: true
        run: |
          {
            for m in https://nofees.testnut.cashu.space https://testnut.cashu.space; do
              echo "== $m"
              curl -sS -m 20 -w '\nHTTP %{http_code} in %{time_total}s\n' "$m/v1/info" 2>&1 | tail -c 600
            done
            # The pay page calls the mint and the price API from the browser, so both need CORS.
            O='https://sealpay.vercel.app'
            echo "== CORS: testnut GET"
            curl -sS -m 20 -D - -o /dev/null -H "Origin: $O" https://testnut.cashu.space/v1/keysets 2>&1 | grep -i '^HTTP\|access-control'
            echo "== CORS: testnut POST preflight"
            curl -sS -m 20 -D - -o /dev/null -X OPTIONS -H "Origin: $O" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' https://testnut.cashu.space/v1/swap 2>&1 | grep -i '^HTTP\|access-control'
            echo "== price API (CoinGecko)"
            curl -sS -m 20 -D - -H "Origin: $O" 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=ngn,eur' 2>&1 | grep -i '^HTTP\|access-control\|bitcoin'
            echo
          } | tee ci-out/probe.log

      - name: Probe public mainnet mints for the real-money test
        continue-on-error: true
        run: node scripts/probe-mints.mjs ci-out/mints.json 2>&1 | tee ci-out/mints.log

      - name: Go/No-Go on the test mint
        id: gonogo
        continue-on-error: true
        run: |
          set -o pipefail
          rc=0
          node scripts/go-no-go.ts 2>&1 | tee ci-out/go-no-go.log || rc=$?
          cp go-no-go.json ci-out/ 2>/dev/null || true
          exit $rc

      - name: Build the app and measure it
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/build-web.mjs 2>&1 | tee ci-out/build.log
          cp web/public/assets/sizes.json ci-out/sizes.json

      - name: The app in a real browser (demo on the test mint, screenshots)
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node scripts/ui-check.mjs ci-out/shots 2>&1 | tee ci-out/ui.log

      - name: Publish to the verify-results branch
        if: always()
        run: |
          cp package-lock.json ci-out/ 2>/dev/null || true
          cd ci-out
          echo "{\"commit\":\"${GITHUB_SHA}\",\"install\":\"${{ steps.install.outcome }}\",\"types\":\"${{ steps.types.outcome }}\",\"tests\":\"${{ steps.tests.outcome }}\",\"mutate\":\"${{ steps.mutate.outcome }}\",\"goNoGo\":\"${{ steps.gonogo.outcome }}\",\"build\":\"${{ steps.build.outcome }}\",\"ui\":\"${{ steps.ui.outcome }}\",\"at\":\"$(date -u +%FT%TZ)\"}" > status.json
          cat status.json
          git init -q && git checkout -q -b verify-results
          git config user.name "sealpay-ci" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "verify ${GITHUB_SHA}"
          # GitHub sometimes answers a push with a server error; try again.
          for i in 1 2 3; do git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" verify-results && break; [ "$i" = 3 ] && exit 1; sleep $((i * 5)); done

      - if: steps.install.outcome != 'success' || steps.types.outcome != 'success' || steps.tests.outcome != 'success' || steps.mutate.outcome != 'success' || steps.gonogo.outcome != 'success' || steps.build.outcome != 'success' || steps.ui.outcome != 'success'
        run: exit 1
